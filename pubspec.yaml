name: intelliguard
description: "IntelliGuard - AI Campus Security Surveillance App (Supabase accounts, offline on-device detection)"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Cloud accounts and data (pinned for review)
  supabase_flutter: 2.17.2
  flutter_secure_storage: 9.2.4
  uuid: 4.5.1
  http: ^1.2.2

  # Local persistence
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4

  # On-device inference: fire/smoke and person classifier enabled.
  # Violence and YOLO remain disabled.
  # MUST stay on 0.12.x or newer — 0.10.4 fails to compile at all on current
  # Dart SDKs (it calls UnmodifiableUint8ListView, an API removed from Dart).
  # 0.12.1 is the version this project has actually been building and
  # running on since that was fixed. Do not downgrade this.
  tflite_flutter: ^0.12.1
  image: ^4.2.0

  # Charts (Weekly Timeline + Event Type Distribution)
  fl_chart: ^0.69.0

  # Live camera feed + frame capture for on-device AI prediction
  camera: ^0.11.0+2

  # Local push-style notifications on new alerts
  flutter_local_notifications: ^18.0.1

  # Dates / formatting
  intl: ^0.19.0

  # PDF report export
  pdf: ^3.11.1
  printing: ^5.13.4

  # Fonts (Inter + JetBrains Mono) without bundling font files
  google_fonts: ^6.3.3

  # Account cache identifiers; retained legacy local-account helper also uses this.
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates the app icon (all Android mipmap sizes) from one source
  # image — see README.md for the "add your app logo" steps.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/models/

# Config for flutter_launcher_icons — run: dart run flutter_launcher_icons
# after putting your logo file at assets/icon/app_icon.png (see README.md).
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#05060F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
